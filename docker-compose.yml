services:
  postgres-db:
    image: postgres:18-alpine
    container_name: postgres_paolicias
    restart: always
    environment:
      POSTGRES_DB: paolicias_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d paolicias_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalogo-service:
    build: ./catalogo-service
    container_name: catalogo_service
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: paolicias_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: update
      SHOW_SQL: "false"

  reservas-service:
    build: ./reservas-service
    container_name: reservas_service
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: paolicias_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: update
      SHOW_SQL: "false"

volumes:
  postgres_data:
