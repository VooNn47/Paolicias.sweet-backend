server:
  port: ${PORT:8082}
  address: 0.0.0.0

spring:
  application:
    name: reservas-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:paolicias_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3   # pocas conexiones: la EC2 tiene poca memoria

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  # Tamaño máximo del comprobante de transferencia
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Dirección de cotizacion-service (calcula el total de cada reserva)
cotizacion:
  url: ${COTIZACION_URL:http://localhost:8083}

# Carpeta donde se guardan las imágenes de los comprobantes (en Docker es un volumen)
comprobantes:
  directorio: ${COMPROBANTES_DIR:./comprobantes}

# Dirección de insumos-service (calcula y descuenta los insumos de cada reserva)
insumos:
  url: ${INSUMOS_URL:http://localhost:8084}
